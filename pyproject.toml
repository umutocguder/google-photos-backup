[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photos-backup"
version = "0.1.0"
description = "High-performance incremental Google Photos backup utility with deduplication, EXIF preservation, and dual CLI/Web UI."
readme = "README.md"
authors = [
    { name = "11Hopem", email = "umutocgdr@gmail.com" }
]
license = { text = "11Hopem Proprietary License" }
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.118.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "rich>=13.7.1",
    "pillow>=10.2.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
gphotos-backup = "main:main"
